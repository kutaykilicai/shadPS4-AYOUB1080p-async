name: Windows build
on:
  push:
  workflow_dispatch:
jobs:
  windows-sdl:
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@v4
      with:
        submodules: recursive
    - name: Configure CMake
      run: cmake --fresh -G Ninja -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION_RELEASE=ON -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
    - name: Build
      run: cmake --build ${{github.workspace}}/build --config Release --parallel $env:NUMBER_OF_PROCESSORS
    - uses: actions/upload-artifact@v4
      with:
        name: shadps4-async-win64
        path: ${{github.workspace}}/build/shadPS4.exe
